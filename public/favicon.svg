<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldSquircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc107" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Canvas -->
  <rect width="512" height="512" rx="140" fill="url(#goldSquircle)" />
  
  <!-- Central Nucleus -->
  <circle cx="256" cy="256" r="32" fill="#040711" />
  
  <!-- Atomic Orbiting Rings -->
  <g stroke="#040711" stroke-width="36" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="256" cy="256" rx="140" ry="54" />
    <ellipse cx="256" cy="256" rx="140" ry="54" transform="rotate(60 256 256)" />
    <ellipse cx="256" cy="256" rx="140" ry="54" transform="rotate(120 256 256)" />
  </g>
</svg>
