<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldSquircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Canvas -->
  <rect width="512" height="512" rx="130" fill="#030c08" />
  <rect width="496" height="496" x="8" y="8" rx="122" fill="none" stroke="url(#limeGlow)" stroke-width="12" opacity="0.9" />
  
  <!-- Glowing Headphone Arc -->
  <path d="M 130 250 A 126 126 0 0 1 382 250" fill="none" stroke="url(#limeGlow)" stroke-width="32" stroke-linecap="round" />
  <!-- Ear Cups -->
  <rect x="110" y="230" width="36" height="74" rx="18" fill="url(#emeraldSquircle)" stroke="#030c08" stroke-width="4" />
  <rect x="366" y="230" width="36" height="74" rx="18" fill="url(#emeraldSquircle)" stroke="#030c08" stroke-width="4" />
  
  <!-- Atomic Science Orbit (Top) -->
  <g transform="translate(256, 120) scale(0.48)" stroke="#a3e635" stroke-width="12" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="14" fill="#a3e635" />
    <ellipse cx="0" cy="0" rx="60" ry="24" />
    <ellipse cx="0" cy="0" rx="60" ry="24" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="60" ry="24" transform="rotate(120)" />
  </g>
  
  <!-- Student Head -->
  <circle cx="256" cy="205" r="42" fill="#ffffff" />
  
  <!-- Open Book & Arms -->
  <path d="M 256 320 Q 200 300 155 315 L 165 410 Q 210 395 256 425 Q 302 395 347 410 L 357 315 Q 312 300 256 320 Z" fill="url(#limeGlow)" />
  <path d="M 256 325 L 256 422" stroke="#030c08" stroke-width="8" stroke-linecap="round" />
</svg>
